name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: System libraries (cairo for cairosvg, DejaVu fonts for the screen)
        run: sudo apt-get update && sudo apt-get install -y libcairo2 fonts-dejavu-core
      - name: Install
        run: |
          python -m pip install --upgrade pip build
          pip install -e .
      - name: Byte-compile
        run: python -m compileall -q byorzin_monitor scripts tests
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Build sdist and wheel
        run: python -m build
      - name: Smoke test the wheel in a clean venv
        run: |
          python -m venv /tmp/wheelenv
          /tmp/wheelenv/bin/pip install dist/*.whl
          /tmp/wheelenv/bin/byorzin-monitor --version
          /tmp/wheelenv/bin/python -c "import importlib.resources as r; assert r.files('byorzin_monitor').joinpath('panel/static/index.html').is_file()"
